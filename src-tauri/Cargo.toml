[package]
name = "wartungsdoku"
version = "0.1.0"
edition = "2021"

[lib]
name = "wartungsdoku_lib"
path = "src/lib.rs"

[dependencies]
arboard = "3.6.1"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
dirs = "7.0.0"
iana-time-zone = "0.1.65"
image = "0.25.10"
r2d2 = "0.8.10"
r2d2_sqlite = "0.35.0"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-single-instance = "2.4.4"
thiserror = "2.0.20"
toml = "1.1.5"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
serde_json = "1.0.151"
tempfile = "3.27.0"

[build-dependencies]
tauri-build = "2.6.3"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11rb = "0.14.0"
