name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: npm audit
        if: matrix.os == 'ubuntu-latest'
        run: npm audit --audit-level=high
        continue-on-error: true

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      # RUSTSEC-2026-0194 and RUSTSEC-2026-0195: denial-of-service issues in
      # quick-xml 0.38.4, pinned below the 0.41.0 fix by citationberg's
      # `quick-xml = "^0.38.1"` requirement (citationberg -> hayagriva ->
      # typst-library -> typst, our PDF renderer). Both advisories are about
      # parsing untrusted, attacker-crafted CSL/bibliography XML through
      # hayagriva's citation formatting. This app never feeds any XML, or any
      # bibliography/citation data at all, into Typst; it only renders a
      # fixed maintenance-report template. The vulnerable code path is
      # unreachable here. Revisit once citationberg allows quick-xml >=0.41.
      - name: Rust security audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
          ignore: RUSTSEC-2026-0194,RUSTSEC-2026-0195
